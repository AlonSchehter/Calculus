<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><script>/* Shared surface lighting. Camera normals use x right, y up, z toward viewer.
   Crease-aware vertex normals preserve genuine sharp folds and cone tips. */
globalThis.SurfaceQuality=(()=>{
 const unit=n=>{const d=Math.hypot(...n)||1;return n.map(v=>v/d);};
 const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
 const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
 const key=p=>p.map(v=>Math.round(v*1e8)).join(',');
 function normals(triangles){const faces=[],adj=new Map();for(const tri of triangles){const n=unit(cross(tri[1].map((v,i)=>v-tri[0][i]),tri[2].map((v,i)=>v-tri[0][i])));faces.push(n);for(const p of tri){const k=key(p);if(!adj.has(k))adj.set(k,[]);adj.get(k).push(n);}}return triangles.map((tri,i)=>tri.map(p=>{const n=faces[i],sum=[0,0,0];for(const q of adj.get(key(p))){if(dot(n,q)<.55)continue;for(let k=0;k<3;k++)sum[k]+=q[k];}return unit(sum);}));}
 function light(n){n=unit(n);if(n[2]<0)n=n.map(v=>-v);const diffuse=Math.max(0,dot(n,[-.61,.57,.55])),fill=Math.max(0,dot(n,[.65,-.15,.74])),spec=Math.pow(Math.max(0,dot(n,unit([-.34,.32,.88]))),32);return [.26+.67*diffuse+.1*fill,.30*spec];}
 function rgb(base,n){const [d,s]=light(n);return base.map(v=>Math.round(Math.max(0,Math.min(255,v*d+255*s))));}
 const half=unit([-.34,.32,.88]);
 function writePixel(base,x,y,z,data,i){const inv=(z<0?-1:1)/(Math.hypot(x,y,z)||1);x*=inv;y*=inv;z*=inv;const d=.26+.67*Math.max(0,-.61*x+.57*y+.55*z)+.1*Math.max(0,.65*x-.15*y+.74*z),s=76.5*Math.pow(Math.max(0,half[0]*x+half[1]*y+half[2]*z),32);data[i]=Math.min(255,Math.round(base[0]*d+s));data[i+1]=Math.min(255,Math.round(base[1]*d+s));data[i+2]=Math.min(255,Math.round(base[2]*d+s));data[i+3]=255;}
 const css=rgb=>'rgb('+rgb.join(',')+')';
 const batches=new WeakMap();
 function enqueue(queue,ctx,tri,project,camera,base=[224,214,192],opacity=.88){if(!tri.every(p=>p.every(Number.isFinite)))return;let batch=batches.get(queue);if(!batch){batch={triangles:[],normals:null};batches.set(queue,batch);}const index=batch.triangles.length;batch.triangles.push(tri);const points=tri.map(project);queue.push({z:points.reduce((s,p)=>s+p[2],0)/3,paint(){if(!batch.normals)batch.normals=normals(batch.triangles);paint(ctx,points,batch.normals[index].map(camera),base,opacity);}});}
 function paint(ctx,p,normals,base,opacity=1){const shades=normals.map(n=>light(n)),v=shades.map(([d,s])=>d+s),[a,b,c]=p,den=(b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]);if(Math.abs(den)<1e-8)return;const gx=((v[1]-v[0])*(c[1]-a[1])-(v[2]-v[0])*(b[1]-a[1]))/den,gy=((b[0]-a[0])*(v[2]-v[0])-(c[0]-a[0])*(v[1]-v[0]))/den,g2=gx*gx+gy*gy;ctx.save();ctx.globalAlpha=opacity;
 if(g2>1e-10){const lo=v.indexOf(Math.min(...v)),hi=v.indexOf(Math.max(...v)),delta=(v[hi]-v[lo])/g2,start=p[lo],gradient=ctx.createLinearGradient(start[0],start[1],start[0]+gx*delta,start[1]+gy*delta);gradient.addColorStop(0,css(rgb(base,normals[lo])));gradient.addColorStop(1,css(rgb(base,normals[hi])));ctx.fillStyle=gradient;}else ctx.fillStyle=css(rgb(base,normals[0]));
 ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fill();ctx.restore();}
 return {unit,normals,light,rgb,writePixel,enqueue,paint};
})();

const lessonResets={};
function zoomTools(parent,change,left='8px'){const bar=document.createElement('div');bar.className='space-tools';bar.style.left=left;for(const [label,factor] of [['−',1/1.2],['+',1.2]]){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-label',factor>1?'Zoom in':'Zoom out');b.onclick=()=>change(factor);bar.append(b);}parent.append(bar);return bar;}
function boundedZoom(z,f){return Math.max(.3,Math.min(4,z*f));}
function fixedAxes(g,project,center,rx,ry,labels=['x','y','z']){const o=project([0,0,0]);labels.forEach((label,i)=>{const v=[0,0,0];v[i]=1;const q=project(v),dx=q[0]-o[0],dy=q[1]-o[1],t=Math.min(rx/Math.max(.001,Math.abs(dx)),ry/Math.max(.001,Math.abs(dy)));const end=[center[0]+dx*t,center[1]+dy*t];segment(g,[center[0]-dx*t,center[1]-dy*t],end,'#b3bdcc',1,true);g.fillStyle='#8894a9';g.font='italic 17px Georgia';g.fillText(label,end[0]+5,end[1]-5);});}

const $=id=>document.getElementById(id);let english=false,started=false,active=0;
const states=[0,1].map(i=>({i,canvas:$(i?'spaceCanvas':'planeCanvas'),box:$(i?'spaceSteps':'planeSteps'),stage:'examples',p:null,v:null,preview:null,depth:0,w:0,h:0,yaw:-.65,pitch:.45,zoom:1}));const colors=['#d62e40','#2463d5','#28966b','#a079b4'];
function cam(p,s){if(s.i===0)return p;const yaw=s.yaw,pitch=s.pitch,a=-Math.sin(yaw)*p[0]+Math.cos(yaw)*p[1],b=Math.cos(yaw)*p[0]+Math.sin(yaw)*p[1];return [a,Math.cos(pitch)*p[2]-Math.sin(pitch)*b,Math.cos(pitch)*b+Math.sin(pitch)*p[2]];}
function unit(s){return Math.min(s.w,s.h)*.2*s.zoom;}function project(p,s){const q=cam(p,s),u=unit(s);return [s.w/2+u*q[0],s.h/2-u*q[1]];}
function fromMouse(e,s){const r=s.canvas.getBoundingClientRect(),a=(e.clientX-r.left-s.w/2)/unit(s),b=(s.h/2-e.clientY+r.top)/unit(s);if(!s.i)return [a,b,0];const yaw=s.yaw,pitch=s.pitch,radial=-Math.sin(pitch)*b+Math.cos(pitch)*s.depth;return [-Math.sin(yaw)*a+Math.cos(yaw)*radial,Math.cos(yaw)*a+Math.sin(yaw)*radial,Math.cos(pitch)*b+Math.sin(pitch)*s.depth];}
function segment(g,a,b,color,width=1.5,head=false){g.strokeStyle=color;g.fillStyle=color;g.lineWidth=width;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke();if(head){const d=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d<1)return;const x=(b[0]-a[0])/d,y=(b[1]-a[1])/d;g.beginPath();g.moveTo(...b);g.lineTo(b[0]-10*x-4*y,b[1]-10*y+4*x);g.lineTo(b[0]-10*x+4*y,b[1]-10*y-4*x);g.fill();}}
